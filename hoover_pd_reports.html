<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hoover PD Reports</title>
  <style>
    :root {
      --bg: #0b1220;
      --panel: #111827;
      --text: #e5e7eb;
      --muted: #9ca3af;
      --accent: #60a5fa;
      --border: #1f2937;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: linear-gradient(180deg, #0b1220 0%, #0f172a 100%);
      color: var(--text);
    }
    .wrap {
      max-width: 1100px;
      margin: 0 auto;
      padding: 24px;
    }
    .card {
      background: rgba(17, 24, 39, 0.94);
      border: 1px solid var(--border);
      border-radius: 18px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.25);
      overflow: hidden;
    }
    header {
      padding: 24px 28px 14px;
      border-bottom: 1px solid var(--border);
    }
    h1 {
      margin: 0 0 6px 0;
      font-size: 32px;
      line-height: 1.1;
    }
    p {
      margin: 0;
      color: var(--muted);
      font-size: 15px;
    }
    .toolbar {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      padding: 18px 28px 0;
    }
    .btn {
      display: inline-block;
      padding: 10px 14px;
      border-radius: 10px;
      background: var(--accent);
      color: #08111f;
      text-decoration: none;
      font-weight: 700;
    }
    .frame {
      padding: 18px 28px 28px;
    }
    iframe {
      width: 100%;
      height: 85vh;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: white;
    }
    .note {
      margin-top: 14px;
      font-size: 13px;
      color: var(--muted);
    }
    @media (max-width: 700px) {
      .wrap { padding: 12px; }
      h1 { font-size: 26px; }
      iframe { height: 75vh; }
      header, .toolbar, .frame { padding-left: 16px; padding-right: 16px; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <header>
        <h1>Hoover PD Reports</h1>
        <p>View the report PDF directly on this page.</p>
      </header>
      <div class="toolbar">
        <a class="btn" href="Case%20Sheet%20Example%20%281%29.pdf" target="_blank" rel="noopener noreferrer">Open PDF in New Tab</a>
      </div>
      <div class="frame">
        <iframe src="Case%20Sheet%20Example%20%281%29.pdf" title="Hoover PD Reports PDF"></iframe>
        <div class="note">If the embedded PDF does not load in your browser, use the button above to open it directly.</div>
      </div>
    </div>
  </div>
</body>
</html>
